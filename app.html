<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7A2331">
<title>Kalakriti — Where tradition meets expression</title>
<style>
/* ═══════════════ RESET & VARIABLES ═══════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#F6EEDE; --paper:#FFF9EC;
  --maroon:#7A2331; --deep-maroon:#5A1825;
  --gold:#D9A441; --gold-light:#E8C57A;
  --terracotta:#C1652F; --leaf:#3F6E52;
  --indigo:#1F3B4D; --ink:#3B2418; --ink-soft:#6B4F3A;
  --shadow:0 4px 16px rgba(122,35,49,.08);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:#e8e0d0; color:var(--ink);
  overflow:hidden; position:fixed; width:100%; height:100%;
}
#app{
  position:relative; width:100%; max-width:480px; height:100vh;
  margin:0 auto; background:var(--cream); overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.15); display:flex; flex-direction:column;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:0;height:0}

/* Doodle background */
.doodle{
  background-color:var(--cream);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(122,35,49,.045) 0, transparent 18%),
    radial-gradient(circle at 85% 65%, rgba(217,164,65,.06) 0, transparent 20%),
    radial-gradient(circle at 50% 90%, rgba(63,110,82,.04) 0, transparent 18%);
}

/* ═══════════════ SPLASH ═══════════════ */
.splash{
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:44px; position:relative;
}
.splash-logo{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center}
.splash-ring{
  position:absolute;border-radius:50%;border:3px solid var(--gold);
  animation:ringPulse 2.4s ease-out infinite;
}
.splash-ring:nth-child(2){animation-delay:.4s;border-color:var(--gold-light);border-width:2px}
.splash-ring:nth-child(3){animation-delay:.8s;border-width:1px}
@keyframes ringPulse{
  0%{width:160px;height:160px;opacity:.8}
  100%{width:280px;height:280px;opacity:0}
}
.splash-core{
  width:160px;height:160px;border-radius:50%;
  background:linear-gradient(135deg,var(--maroon),var(--deep-maroon));
  display:flex;align-items:center;justify-content:center;font-size:72px;
  box-shadow:0 12px 32px rgba(122,35,49,.35);
  animation:corePop .9s cubic-bezier(.2,1.4,.5,1) both;
}
@keyframes corePop{from{transform:scale(.45);opacity:0}to{transform:scale(1);opacity:1}}
.splash-text{
  text-align:center;animation:fadeUp .9s .3s ease-out both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.splash-text h1{
  font-size:42px;color:var(--maroon);letter-spacing:2px;font-weight:700;
}
.splash-text h2{
  font-size:15px;color:var(--maroon);letter-spacing:7px;font-weight:600;margin-top:6px;
}
.splash-text p{
  font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:14px;
}
.splash-dots{display:flex;gap:6px;animation:fadeUp .9s .3s ease-out both}
.splash-dots span{
  width:8px;height:8px;border-radius:4px;background:var(--maroon);opacity:.3;
  animation:dotAnim 1.4s infinite;
}
.splash-dots span:nth-child(2){animation-delay:.2s}
.splash-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotAnim{0%,60%,100%{opacity:.3;width:8px}30%{opacity:1;width:18px}}

/* ═══════════════ ONBOARDING ═══════════════ */
.onboard{flex:1;display:flex;flex-direction:column;padding:24px}
.onboard-track{flex:1;display:flex;overflow:hidden}
.onboard-page{
  min-width:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;padding:24px;text-align:center;
  transition:transform .35s ease;
}
.onboard-illus{
  width:200px;height:200px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:96px;
  border:2px solid;
}
.onboard-page h3{font-size:26px;color:var(--maroon);font-weight:700;line-height:1.3}
.onboard-page p{font-size:15px;color:var(--ink-soft);line-height:1.6;max-width:320px}
.onboard-foot{display:flex;align-items:center;gap:8px}
.onboard-dots{display:flex;gap:6px}
.onboard-dots i{
  display:block;width:8px;height:8px;border-radius:4px;
  background:var(--maroon);opacity:.3;transition:.25s;
}
.onboard-dots i.on{width:24px;opacity:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;
  background:var(--maroon);color:#fff;transition:.15s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon)}
.btn.gold{background:var(--gold);color:var(--maroon)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}

/* ═══════════════ LOGIN ═══════════════ */
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:28px;overflow-y:auto}
.login-inner{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:400px}
.login-logo{
  width:140px;height:140px;border-radius:50%;
  background:linear-gradient(135deg,var(--maroon),var(--deep-maroon));
  display:flex;align-items:center;justify-content:center;font-size:68px;
  box-shadow:0 12px 30px rgba(122,35,49,.35);
}
.login h1{font-size:38px;color:var(--maroon);letter-spacing:2px;margin-top:22px}
.login h2{font-size:13px;color:var(--maroon);letter-spacing:6px;font-weight:600}
.login .tag{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:4px}
.login .welcome{font-size:18px;font-weight:600;color:var(--ink);margin-top:44px}
.login .sub{font-size:13px;color:var(--ink-soft);text-align:center}
.google-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:16px;border-radius:14px;background:#fff;
  border:1.5px solid rgba(217,164,65,.6);font-weight:600;font-size:16px;
  color:var(--maroon);margin-top:20px;transition:.15s;
}
.google-btn:active{transform:scale(.98)}
.google-g{font-size:24px;font-weight:700;color:#4285F4}
.secure-note{
  display:flex;align-items:center;gap:6px;font-size:11px;
  color:var(--ink-soft);opacity:.7;margin-top:28px;
}
.err-box{
  width:100%;padding:12px;border-radius:12px;background:#fdeaea;
  border:1px solid #f5c2c2;color:#c0392b;font-size:13px;margin-top:16px;
  display:flex;gap:8px;align-items:center;
}

/* ═══════════════ MAIN SHELL ═══════════════ */
.appbar{
  background:var(--maroon);color:#fff;padding:14px 16px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:10;
}
.appbar .title{font-size:17px;font-weight:700;letter-spacing:1.2px;display:flex;align-items:center;gap:8px}
.appbar .spacer{flex:1}
.appbar .icon-btn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:19px;position:relative;transition:.15s;
}
.appbar .icon-btn:active{background:rgba(255,255,255,.15)}
.dot-badge{
  position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--gold);border:1.5px solid var(--maroon);
}
.screen{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:8px;position:relative;
}
.bottomnav{
  display:flex;background:var(--paper);border-top:1px solid rgba(217,164,65,.4);
  flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 8px;color:var(--ink-soft);font-size:10px;font-weight:600;
  position:relative;transition:.15s;
}
.bottomnav button.on{color:var(--maroon)}
.bottomnav .nav-ic{font-size:22px;line-height:1}
.cart-badge{
  position:absolute;top:4px;right:calc(50% - 22px);
  background:var(--gold);color:var(--maroon);font-size:9px;font-weight:700;
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}

/* ═══════════════ CARDS & LAYOUT ═══════════════ */
.card{
  background:var(--paper);border-radius:14px;
  border:1px solid rgba(217,164,65,.4);padding:14px;
}
.section-title{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
  color:var(--maroon);margin:14px 14px 8px;
}
.section-title::before{
  content:'';width:4px;height:16px;background:var(--gold);border-radius:2px;
}
.field{margin-bottom:14px}
.field label{
  display:flex;align-items:center;gap:8px;font-weight:700;color:var(--maroon);
  font-size:13px;margin-bottom:6px;
}
.field label::before{content:'';width:4px;height:14px;background:var(--gold);border-radius:2px}
.field input,.field textarea,.field select{
  width:100%;padding:12px 14px;border:1px solid rgba(217,164,65,.5);
  border-radius:12px;background:var(--paper);color:var(--ink);font-size:14px;
  transition:.15s;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--maroon);box-shadow:0 0 0 3px rgba(122,35,49,.08);
}

/* ═══════════════ SEARCH & CHIPS ═══════════════ */
.search-wrap{padding:12px 14px 6px}
.search{
  display:flex;align-items:center;gap:10px;background:var(--paper);
  border:1px solid rgba(217,164,65,.5);border-radius:24px;padding:0 16px;
}
.search input{flex:1;padding:12px 0;border:none;background:transparent;font-size:14px}
.chips{display:flex;gap:8px;padding:8px 14px;overflow-x:auto}
.chip{
  padding:8px 16px;border-radius:20px;background:var(--paper);
  border:1px solid rgba(217,164,65,.5);color:var(--maroon);font-size:13px;
  font-weight:600;white-space:nowrap;transition:.15s;
}
.chip.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* ═══════════════ PRODUCT GRID ═══════════════ */
.banner{
  margin:10px 14px;padding:12px;border-radius:12px;display:flex;gap:10px;
  align-items:center;font-size:12px;font-weight:500;
  background:linear-gradient(90deg,rgba(217,164,65,.18),rgba(217,164,65,.08));
  border:1px solid rgba(217,164,65,.5);color:var(--maroon);
}
.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 12px 90px;
}
.pcard{
  background:var(--paper);border-radius:16px;overflow:hidden;
  border:1px solid rgba(217,164,65,.35);
  box-shadow:0 4px 12px rgba(122,35,49,.08);
  display:flex;flex-direction:column;transition:.15s;
}
.pcard:active{transform:scale(.98)}
.pcard-img{
  aspect-ratio:1;position:relative;display:flex;align-items:center;
  justify-content:center;font-size:56px;color:#fff;
}
.pcard-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard-title{
  font-size:13px;font-weight:700;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pcard-seller{
  font-size:10px;color:var(--ink-soft);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pcard-rating{font-size:11px;color:var(--gold);font-weight:600}
.pcard-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.pcard-price{font-size:16px;font-weight:700;color:var(--maroon)}
.pcard-add{
  width:30px;height:30px;border-radius:50%;background:var(--maroon);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.badge-new{
  position:absolute;top:8px;left:8px;background:var(--maroon);color:#fff;
  font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px;
  letter-spacing:.5px;
}
.badge-cat{
  position:absolute;bottom:8px;left:8px;background:rgba(122,35,49,.85);
  color:#fff;font-size:9px;padding:3px 8px;border-radius:4px;font-weight:500;
}
.wish-btn{
  position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.95);display:flex;align-items:center;
  justify-content:center;font-size:16px;
}
.trust-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 6px;
  border-radius:4px;font-size:9px;font-weight:700;
}

/* ═══════════════ EMPTY STATES ═══════════════ */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:60px 24px;text-align:center;
}
.empty-circle{
  width:110px;height:110px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:52px;background:rgba(217,164,65,.15);
  color:var(--maroon);
}
.empty h3{font-size:16px;color:var(--ink);font-weight:600}
.empty p{font-size:13px;color:var(--ink-soft);line-height:1.5;max-width:260px}

/* ═══════════════ OVERLAY (pushed screens) ═══════════════ */
.overlay{
  position:absolute;inset:0;background:var(--cream);z-index:50;
  display:flex;flex-direction:column;
  animation:slideIn .22s ease-out;
}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.overlay .appbar{background:var(--maroon)}

/* ═══════════════ DETAIL SCREEN ═══════════════ */
.detail-hero{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:120px;color:#fff;position:relative;
}
.detail-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.detail-cat{
  display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;
  font-weight:600;background:rgba(122,35,49,.1);color:var(--maroon);
  border:1px solid rgba(122,35,49,.3);
}
.detail-title{font-size:24px;font-weight:700;color:var(--maroon);line-height:1.25}
.detail-price{font-size:30px;font-weight:700;color:var(--maroon)}
.detail-desc{font-size:14px;line-height:1.65;color:var(--ink)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  padding:6px 12px;border-radius:14px;background:var(--paper);
  border:1px solid rgba(217,164,65,.4);font-size:12px;color:var(--ink);
}
.delivery-box{
  padding:14px;border-radius:12px;background:rgba(63,110,82,.1);
  border:1px solid rgba(63,110,82,.4);display:flex;flex-direction:column;gap:8px;
}
.delivery-box .row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft)}
.delivery-box .row b{color:var(--leaf);font-weight:700}
.detail-actions{
  display:flex;gap:10px;padding:12px;background:var(--paper);
  border-top:1px solid rgba(217,164,65,.4);flex-shrink:0;
}
.detail-actions .btn{flex:1}

/* ═══════════════ CART / CHECKOUT ═══════════════ */
.cart-item{
  display:flex;gap:12px;align-items:center;margin:0 12px 10px;
  padding:10px;background:var(--paper);border-radius:14px;
  border:1px solid rgba(217,164,65,.35);
}
.cart-thumb{
  width:72px;height:72px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:36px;color:#fff;flex-shrink:0;
}
.cart-info{flex:1;min-width:0}
.cart-info h4{
  font-size:13px;font-weight:700;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cart-info .price{font-size:12px;color:var(--ink-soft);margin:2px 0 6px}
.qty-ctrl{display:flex;align-items:center;gap:12px}
.qty-btn{
  width:26px;height:26px;border-radius:8px;background:rgba(122,35,49,.08);
  display:flex;align-items:center;justify-content:center;color:var(--maroon);
  font-weight:700;
}
.cart-line-total{font-size:15px;font-weight:700;color:var(--maroon);flex-shrink:0}
.checkout-total{
  padding:16px;background:var(--paper);border-top:1px solid rgba(217,164,65,.4);
}
.sum-row{
  display:flex;justify-content:space-between;font-size:13px;
  color:var(--ink-soft);padding:4px 0;
}
.sum-row.big{font-size:16px;font-weight:700;color:var(--maroon);padding-top:8px;
  border-top:1px solid rgba(217,164,65,.3);margin-top:6px}
.sum-row.green{color:var(--leaf)}

/* ═══════════════ WALLET ═══════════════ */
.wallet-hero{
  margin:16px;padding:24px;border-radius:20px;color:#fff;
  background:linear-gradient(135deg,var(--maroon),var(--deep-maroon));
  box-shadow:0 10px 30px rgba(122,35,49,.35);
}
.wallet-hero .label{font-size:13px;opacity:.85}
.wallet-hero .coins{font-size:38px;font-weight:700;margin:8px 0;display:flex;align-items:center;gap:10px}
.wallet-hero .sub{font-size:11px;opacity:.75}
.earn-tile{
  display:flex;gap:12px;align-items:center;padding:14px;margin:0 16px 10px;
  background:var(--paper);border-radius:14px;
  border:1px solid rgba(217,164,65,.35);
}
.earn-tile .ic{
  width:40px;height:40px;border-radius:10px;background:rgba(217,164,65,.15);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  color:var(--maroon);flex-shrink:0;
}
.earn-tile .info{flex:1;min-width:0}
.earn-tile h4{font-size:14px;font-weight:700;color:var(--ink)}
.earn-tile .r{font-size:12px;color:var(--leaf);margin-top:2px}

/* ═══════════════ PROFILE ═══════════════ */
.profile-hero{
  margin:16px;padding:22px;border-radius:20px;color:#fff;text-align:center;
  background:linear-gradient(135deg,var(--maroon),var(--deep-maroon));
  box-shadow:0 10px 28px rgba(122,35,49,.3);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.profile-avatar{
  width:80px;height:80px;border-radius:50%;background:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:40px;
  color:var(--maroon);font-weight:700;
}
.profile-name{font-size:20px;font-weight:700}
.profile-email{font-size:12px;opacity:.8}
.profile-badges{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.p-badge{
  padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.15);
  font-size:10px;display:flex;align-items:center;gap:4px;
}
.qa-row{display:flex;gap:10px;padding:0 16px}
.qa-btn{
  flex:1;padding:14px 8px;border-radius:14px;background:var(--paper);
  border:1px solid rgba(217,164,65,.4);display:flex;flex-direction:column;
  align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink);
}
.qa-btn .ic{font-size:22px;color:var(--maroon)}
.menu-list{padding:6px 16px 90px}
.menu-tile{
  display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;
  background:var(--paper);border-radius:14px;
  border:1px solid rgba(217,164,65,.4);font-size:14px;font-weight:600;color:var(--ink);
  transition:.15s;
}
.menu-tile:active{background:#fff8e8}
.menu-tile .ic{font-size:20px;color:var(--maroon);width:24px;text-align:center}
.menu-tile .chev{margin-left:auto;color:var(--ink-soft);font-size:18px}
.menu-tile.danger{color:#c0392b}
.menu-tile.danger .ic{color:#c0392b}

/* ═══════════════ UPLOAD SCREEN ═══════════════ */
.upload{padding:16px 16px 90px}
.voice-card{
  padding:16px;border-radius:16px;color:#fff;margin-bottom:16px;
  background:linear-gradient(135deg,var(--maroon),var(--deep-maroon));
  box-shadow:0 8px 20px rgba(122,35,49,.3);display:flex;gap:14px;
  align-items:center;transition:.15s;
}
.voice-card:active{transform:scale(.98)}
.voice-card .mic{
  width:52px;height:52px;border-radius:50%;background:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  color:var(--maroon);flex-shrink:0;
}
.voice-card .info h4{font-size:16px;font-weight:700;margin-bottom:3px}
.voice-card .info p{font-size:11px;opacity:.85}
.photo-drop{
  height:200px;border-radius:20px;background:var(--paper);
  border:1.5px dashed rgba(217,164,65,.6);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:var(--ink-soft);
  cursor:pointer;transition:.15s;margin-bottom:14px;
}
.photo-drop:active{background:#fff4dc}
.photo-drop .ic{
  width:70px;height:70px;border-radius:50%;background:rgba(217,164,65,.15);
  display:flex;align-items:center;justify-content:center;font-size:32px;
  color:var(--maroon);
}
.photo-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 0 14px}
.photo-thumb{
  position:relative;width:110px;height:110px;flex-shrink:0;border-radius:14px;
  overflow:hidden;
}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .x{
  position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:14px;
}
.loc-card{
  padding:14px;border-radius:14px;display:flex;gap:12px;align-items:center;
  margin-bottom:16px;
}
.loc-card.set{background:rgba(63,110,82,.1);border:1.5px solid rgba(63,110,82,.5)}
.loc-card.unset{background:rgba(217,164,65,.15);border:1.5px solid rgba(122,35,49,.5)}
.loc-card .ic{font-size:22px;flex-shrink:0}
.loc-card .info{flex:1;min-width:0}
.loc-card .info h4{font-size:14px;font-weight:700}
.loc-card .info p{font-size:11px;color:var(--ink-soft);margin-top:2px}

/* ═══════════════ OVERLAY FORM ═══════════════ */
.modal-bg{
  position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--cream);border-radius:24px 24px 0 0;width:100%;
  max-height:85vh;overflow-y:auto;padding:20px;
  animation:slideUp .25s ease-out;
}
@keyframes slideUp{from{transform:translateY(30px)}to{transform:none}}
.modal h3{font-size:18px;font-weight:700;color:var(--maroon);margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--leaf);color:#fff;padding:12px 20px;border-radius:12px;
  font-size:14px;font-weight:500;z-index:1000;max-width:90%;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
  animation:toastIn .3s ease-out;
}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* Tabs inside screens */
.tabs{display:flex;gap:8px;padding:12px 16px 8px}
.tab{
  flex:1;padding:10px;border-radius:10px;background:var(--paper);
  border:1px solid rgba(217,164,65,.4);font-size:13px;font-weight:600;
  color:var(--ink-soft);text-align:center;transition:.15s;
}
.tab.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* Review card */
.review{
  padding:12px;border-radius:12px;background:var(--paper);margin-bottom:10px;
  border:1px solid rgba(217,164,65,.35);
}
.review-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.review-av{
  width:28px;height:28px;border-radius:50%;background:rgba(217,164,65,.4);
  display:flex;align-items:center;justify-content:center;color:var(--maroon);
  font-weight:700;font-size:12px;
}
.review-name{font-size:13px;font-weight:600;flex:1;color:var(--ink)}
.review-text{font-size:13px;color:var(--ink);line-height:1.45}

/* Star rating */
.stars{color:var(--gold);font-size:14px;letter-spacing:1px}

/* Notification item */
.notif{
  padding:14px;border-radius:14px;background:var(--paper);margin:0 16px 10px;
  border:1px solid rgba(217,164,65,.35);display:flex;gap:12px;
}
.notif.unread{border-color:var(--maroon);background:#fff}
.notif .ic{
  width:38px;height:38px;border-radius:50%;background:rgba(217,164,65,.2);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  color:var(--maroon);flex-shrink:0;
}
.notif h4{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.notif p{font-size:13px;color:var(--ink-soft);line-height:1.4}

/* Chat bubbles */
.chat-bubble{
  max-width:78%;padding:10px 14px;border-radius:14px;margin-bottom:10px;
  font-size:14px;line-height:1.45;word-wrap:break-word;
}
.chat-bubble.me{
  align-self:flex-end;background:var(--maroon);color:#fff;
  border-bottom-right-radius:2px;
}
.chat-bubble.them{
  align-self:flex-start;background:var(--paper);color:var(--ink);
  border:1px solid rgba(217,164,65,.4);border-bottom-left-radius:2px;
}

/* Chips toggle */
.toggle-row{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
.toggle-chip{
  padding:8px 14px;border-radius:20px;background:var(--paper);
  border:1px solid rgba(217,164,65,.5);font-size:12px;font-weight:600;
  color:var(--maroon);white-space:nowrap;transition:.15s;
  display:flex;align-items:center;gap:6px;
}
.toggle-chip.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* Language switcher */
.lang-wrap{
  padding:14px;background:#fff;border-radius:12px;
  border:1px solid rgba(217,164,65,.5);margin-bottom:14px;
}
.lang-wrap h4{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
  color:var(--maroon);margin-bottom:12px;
}
.lang-grid{display:flex;gap:8px;flex-wrap:wrap}
.lang-btn{
  padding:10px 14px;border-radius:10px;background:var(--paper);
  border:1px solid rgba(217,164,65,.6);display:flex;flex-direction:column;
  gap:2px;transition:.2s;
}
.lang-btn.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.lang-btn .native{font-size:14px;font-weight:700}
.lang-btn .lbl{font-size:11px;opacity:.75}

/* Splash overlay */
.center-spin{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:30px;color:var(--maroon);font-size:14px;
}
.spin{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(122,35,49,.2);border-top-color:var(--maroon);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return {...DEFAULT_STATE, ...parsed, screen:'splash', stack:[]};
    }
  }catch(e){}
  const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
  fresh.products = SEED_PRODUCTS.map(p=>({...p}));
  return fresh;
}
function save(){
  try{
    const copy = {...state, screen:'main', stack:[]};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
  }catch(e){}
}

function t(k){ return (I18N[state.lang] && I18N[state.lang][k]) || I18N.en[k] || k; }
function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function rupees(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function productGradient(p){
  const c = CAT_COLORS[p.category] || ['#1F3B4D','#0F2530'];
  return `background:linear-gradient(135deg,${c[0]},${c[1]})`;
}
function catEmoji(c){ return CAT_EMOJI[c] || '🛍️'; }

function stars(rating, size){
  size = size || 14;
  let html = '<span class="stars" style="font-size:'+size+'px">';
  for(let i=0;i<5;i++){
    const v = rating - i;
    if(v >= 1) html += '★';
    else if(v >= 0.5) html += '⯨';
    else html += '☆';
  }
  html += '</span>';
  return html;
}

function toast(msg, color){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  if(color) el.style.background = color;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function getProduct(id){ return state.products.find(p=>p.id===id); }

/* ─── Cart helpers ─── */
function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  let t = 0;
  for(const id in state.cart){
    const p = getProduct(id);
    if(p) t += p.price * state.cart[id];
  }
  return t;
}
function hasLocation(){ return state.userLat !== 0 || state.userLng !== 0; }

function haversine(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function distanceToProduct(p){
  if(!hasLocation() || !p.lat || !p.lng) return 800;
  return haversine(state.userLat,state.userLng,p.lat,p.lng);
}
function deliveryDaysFor(km){
  if(km<=200) return 2; if(km<=500) return 3; if(km<=800) return 4;
  if(km<=1200) return 5; if(km<=1800) return 6; if(km<=2500) return 7;
  return 8;
}
function deliveryFeeFor(km){
  if(km<=100) return 0; if(km<=500) return 40; if(km<=1200) return 80;
  if(km<=2000) return 120; return 180;
}
function cartDeliveryFee(){
  if(cartCount()===0) return 0;
  let max = 0;
  for(const id in state.cart){
    const p = getProduct(id);
    if(p){ const f = deliveryFeeFor(distanceToProduct(p)); if(f>max) max=f; }
  }
  return max;
}
function cartDeliveryDays(){
  let max = 0;
  for(const id in state.cart){
    const p = getProduct(id);
    if(p){ const d = deliveryDaysFor(distanceToProduct(p)); if(d>max) max=d; }
  }
  return max;
}

const AI_BASE = 'https://kalak-shetra-ai.onrender.com';

async function aiAnalyze(imageDataUrl, userDesc){
  try{
    const blob = await (await fetch(imageDataUrl)).blob();
    const form = new FormData();
    form.append('file', blob, 'p.jpg');
    form.append('user_desc', userDesc || '');
    const res = await fetch(AI_BASE + '/analyze-product', {method:'POST', body:form});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.warn('AI analyze failed', e); return null; }
}

async function aiChat(messages){
  try{
    const res = await fetch(AI_BASE + '/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages}),
    });
    if(!res.ok) return null;
    const d = await res.json();
    return d.reply;
  }catch(e){ console.warn('AI chat failed', e); return null; }
}

async function aiVoiceListing(text, sourceLang){
  try{
    const res = await fetch(AI_BASE + '/translate-and-analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, source_lang:sourceLang}),
    });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.warn('AI voice failed', e); return null; }
}

/* ═══════════════ ROUTER ═══════════════ */
function go(screen){ state.screen = screen; render(); }
function push(screen, params){
  state.stack.push({screen, params:params||{}});
  render();
}
function pop(){ state.stack.pop(); render(); }
function setTab(tab){ state.tab = tab; render(); }

/* ═══════════════ RENDER ═══════════════ */
const app = document.getElementById('app');

function render(){
  let html = '';
  if(state.screen === 'splash') html = viewSplash();
  else if(state.screen === 'onboarding') html = viewOnboard();
  else if(state.screen === 'login') html = viewLogin();
  else html = viewMain();

  if(state.stack.length){
    const top = state.stack[state.stack.length-1];
    html += viewOverlay(top);
  }

  app.innerHTML = html;
  save();
}

function setInner(html){
  let full = '';
  if(state.screen === 'splash') full = viewSplash();
  else if(state.screen === 'onboarding') full = viewOnboard();
  else if(state.screen === 'login') full = viewLogin();
  else full = viewMain();
  if(state.stack.length){
    const top = state.stack[state.stack.length-1];
    full += viewOverlay(top);
  }
  app.innerHTML = full;
}

function filteredFeed(){
  let list = [...state.products];
  if(shopCat !== 'All') list = list.filter(p=>p.category===shopCat);
  if(shopNearMe && hasLocation()) list = list.filter(p=>distanceToProduct(p)<=300);
  if(shopQuery){
    const q = shopQuery.toLowerCase();
    list = list.filter(p=>
      p.title.toLowerCase().includes(q) ||
      p.description.toLowerCase().includes(q) ||
      p.sellerName.toLowerCase().includes(q) ||
      (p.keywords||[]).some(k=>k.includes(q))
    );
  }
  if(shopSort === 'price_low') list.sort((a,b)=>a.price-b.price);
  else if(shopSort === 'price_high') list.sort((a,b)=>b.price-a.price);
  else if(shopSort === 'rating') list.sort((a,b)=>b.rating-a.rating);
  else if(shopSortDist && hasLocation()) list.sort((a,b)=>distanceToProduct(a)-distanceToProduct(b));
  else list.sort((a,b)=>b.createdAt-a.createdAt);
  return list;
}

function renderGrid(list){
  if(list.length === 0){
    return `<div class="empty"><div class="empty-circle">🔍</div>

function submitReview(productId){
  const text = (document.getElementById('reviewText').value||'').trim();
  if(!text){ toast('Please write a review'); return; }
  const p = getProduct(productId);
  const list = state.reviews[productId] || [];
  list.unshift({
    id: uid(),
    userName: state.user?.displayName || 'You',
    rating: reviewRating,
    text,
    createdAt: Date.now(),
  });
  state.reviews[productId] = list;
  if(p){
    const total = p.rating * p.ratingCount + reviewRating;
    p.ratingCount += 1;
    p.rating = total / p.ratingCount;
  }
  reviewRating = 5;
  toast(t('review_added'), '#3F6E52');
  pop();
}

function applyCoupon(){
  const code = (checkoutCouponInput||'').trim().toUpperCase();
  const c = COUPONS.find(x=>x.code===code);
  if(!c || cartTotal() < c.minCart){
    checkoutCoupon = null;
    toast(t('invalid_coupon'));
  } else {
    checkoutCoupon = c;
    toast(t('coupon_applied'), '#3F6E52');
  }
  setInner();
}

function placeOrder(){
  if(!state.addresses.length){
    toast('Please add a delivery address');
    return;
  }
  const addr = state.addresses.find(a=>a.isDefault) || state.addresses[0];
  const sub = cartTotal();
  let discount = 0;
  if(checkoutCoupon && sub >= checkoutCoupon.minCart){
    discount = Math.min(sub * checkoutCoupon.percent / 100, checkoutCoupon.maxDiscount);
  }
  const delivery = hasLocation() ? cartDeliveryFee() : (sub>500?0:40);
  const days = hasLocation() ? cartDeliveryDays() : 4;
  const grand = sub - discount + delivery;
  const count = cartCount();
  const oid = uid().slice(-8).toUpperCase();

  state.orders.unshift({
    id: oid, total: grand, itemCount: count, status: 'confirmed',
    placedAt: Date.now(), deliveryDays: days, coupon: checkoutCoupon?.code,
    deliveryFee: delivery, deliveryAddress: `${addr.line}, ${addr.city}`,
  });
  addNotif('Order placed', `Order #${oid} confirmed. Total ${rupees(grand)}`);

  state.cart = {};
  checkoutCoupon = null;
  checkoutCouponInput = '';
  state.coins += 25;
  save();

  // replace checkout with success
  state.stack = [{screen:'orderSuccess', params:{oid, total:grand, count}}];
  render();
}

function pickImages(){

function fileToDataUrl(file){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.readAsDataURL(file);
  });
}

/* ─── Voice listing ─── */
function startVoiceListing(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    toast(t('mic_unavailable')); return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = uploadVoiceLang;
  rec.continuous = false;
  rec.interimResults = false;
  let heard = '';

  // show modal
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal" style="text-align:center">
      <h3>🎤 ${esc(t('voice_listing'))}</h3>
      <div class="spin" style="margin:20px auto"></div>
      <div id="heardText" style="font-size:14px;min-height:40px;color:#3B2418">${esc(t('speak_now'))}</div>
      <div style="font-size:11px;color:#6B4F3A;margin-top:8px">Language: ${uploadVoiceLang.split('-')[0].toUpperCase()}</div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="this.closest('.modal-bg').remove();window._stopSR=true">${esc(t('cancel'))}</button>
        <button class="btn" id="voiceDone">Done</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  rec.onresult = (e)=>{
    heard = e.results[0][0].transcript;
    const el = document.getElementById('heardText');
    if(el) el.textContent = heard;
  };
  rec.onerror = (e)=>{
    console.warn('SR error', e);
  };
  rec.start();

  document.getElementById('voiceDone').onclick = async ()=>{
    rec.stop();
    modal.remove();
    if(!heard.trim()){ toast('No speech detected'); return; }
    uploadBusy = true; setInner();
    const result = await aiVoiceListing(heard, uploadVoiceLang);
    uploadBusy = false;
    if(!result){ toast('AI failed. Try again.'); return; }
    setInner();
    const t2 = document.getElementById('upTitle'); if(t2) t2.value = result.title || '';
    const d2 = document.getElementById('upDesc'); if(d2) d2.value = result.description_en || '';
    const h2 = document.getElementById('upDescHi'); if(h2) h2.value = result.description_native || '';
    const p2 = document.getElementById('upPrice');
    if(p2 && result.price_low && result.price_high){
      p2.value = Math.round((result.price_low + result.price_high)/2);
    }
    if(result.category && CATEGORIES.includes(result.category)) uploadCategory = result.category;
    uploadShowTrans = true;
    setInner();
    // restore
    const t3 = document.getElementById('upTitle'); if(t3) t3.value = result.title || '';
    const d3 = document.getElementById('upDesc'); if(d3) d3.value = result.description_en || '';
    const h3 = document.getElementById('upDescHi'); if(h3) h3.value = result.description_native || '';
    const p3 = document.getElementById('upPrice'); if(p3 && result.price_low) p3.value = Math.round((result.price_low+result.price_high)/2);
    toast(t('ai_filled'), '#3F6E52');
  };
}

function publishListing(){
  const title = (document.getElementById('upTitle')?.value||'').trim();
  const desc = (document.getElementById('upDesc')?.value||'').trim();
  const descHi = (document.getElementById('upDescHi')?.value||'').trim();
  const price = parseFloat(document.getElementById('upPrice')?.value||'0');
  const loc = (document.getElementById('upLocation')?.value||'').trim();
  const del = (document.getElementById('upDelivery')?.value||'').trim();

  if(!title || !price || !uploadImages.length){ toast(t('fill_required')); return; }

  const lat = uploadProductLat || state.userLat;
  const lng = uploadProductLng || state.userLng;
  const location = uploadProductLocation || loc || state.userCity;

  const p = {
    id: uid(),
    title, description: desc, descriptionHi: descHi,
    category: uploadCategory, price,
    sellerId: state.user?.uid || 'anon',
    sellerName: state.user?.displayName || 'You',
    location, deliveryInfo: del,
    images: uploadImages.slice(),
    rating: 0, ratingCount: 0, views: 0,
    createdAt: Date.now(),
    keywords: extractKeywords(title + ' ' + desc),
    lat, lng,
  };
  state.products.unshift(p);
  addNotif('Listing published', `"${title}" is now live.`);
  toast(t('uploaded'), '#3F6E52');

  // reset
  uploadImages = [];
  uploadShowTrans = false;
  uploadProductLat = 0; uploadProductLng = 0; uploadProductLocation = '';
  setTab('shop');
}

function extractKeywords(text){
  const stop = new Set(['the','a','an','and','or','in','on','at','to','for','of','with','by','is','are','this','that']);
  const freq = {};
  text.toLowerCase().split(/\W+/).forEach(w=>{
    if(w.length>2 && !stop.has(w)) freq[w] = (freq[w]||0)+1;
  });
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
}

async function getBrowserLocation(){
  if(!navigator.geolocation) return null;
  return new Promise(resolve=>{
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}),
      ()=>resolve(null),
      {timeout:10000}
    );
  });
}
async function useMyLocation(){
  const loc = await getBrowserLocation();
  if(loc){
    state.userLat = loc.lat; state.userLng = loc.lng;
    state.userCity = nearestCity(loc.lat, loc.lng);
    save();
    toast(t('location_set'), '#3F6E52');
    pop();
  } else {
    toast('Location permission denied');
  }
}
function manualLocation(){
  const cities = {
    'Delhi, DL':[28.6139,77.2090],'Mumbai, MH':[19.0760,72.8777],
    'Kolkata, WB':[22.5726,88.3639],'Chennai, TN':[13.0827,80.2707],
    'Bengaluru, KA':[12.9716,77.5946],'Hyderabad, TS':[17.3850,78.4867],
    'Jaipur, RJ':[26.9124,75.7873],'Varanasi, UP':[25.3176,82.9739],
  };
  const names = Object.keys(cities);
  const pick = prompt('Pick your city:\n\n' + names.map((c,i)=>`${i+1}. ${c}`).join('\n'), '1');
  const idx = parseInt(pick,10)-1;
  if(idx>=0 && idx<names.length){
    const [lat,lng] = cities[names[idx]];
    state.userLat = lat; state.userLng = lng; state.userCity = names[idx];
    save();
    toast(t('location_set'), '#3F6E52');
    pop();
  }
}

/* ═══════════════ CHAT (AI) ═══════════════ */
let chatMsgs = [];
function viewChat(){
  return `
  <div class="appbar">
    <button class="icon-btn" onclick="pop()">←</button>
    <div class="title">${esc(t('chat_title'))}</div>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="chatMsgs=[];setInner()">🗑️</button>
  </div>
  <div class="screen doodle" id="chatScreen" style="display:flex;flex-direction:column;padding:14px">
    ${chatMsgs.length===0?`
      <div class="empty" style="flex:1">
        <div class="empty-circle">✨</div>
        <p>${esc(t('chat_empty'))}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">
          ${['What should I price my saree?','Festival sale tips?','Photo tips for jewelry?'].map(q=>`
            <button class="chip" onclick="sendChat('${esc(q)}')">${esc(q)}</button>
          `).join('')}
        </div>
      </div>
    `:`
      ${chatMsgs.map(m=>`
        <div class="chat-bubble ${m.role==='user'?'me':'them'}">${esc(m.content)}</div>
      `).join('')}
    `}
  </div>
  <div style="padding:10px;background:#FFF9EC;border-top:1px solid rgba(217,164,65,.4);display:flex;gap:8px;align-items:center">
    <button class="icon-btn" style="color:#7A2331" onclick="chatMic()">🎤</button>
    <input id="chatInput" placeholder="${esc(t('chat_hint'))}"
      style="flex:1;padding:12px 14px;border-radius:24px;border:1px solid rgba(217,164,65,.5);background:#fff;font-size:14px"
      onkeydown="if(event.key==='Enter')sendChat()">
    <button class="btn" style="padding:10px 14px;border-radius:50%" onclick="sendChat()">➤</button>
  </div>`;
}

async function sendChat(prefill){
  const input = document.getElementById('chatInput');
  const text = prefill || (input?.value || '').trim();
  if(!text) return;
  chatMsgs.push({role:'user', content:text});
  if(input) input.value = '';
  setInner();
  scrollChat();
  chatMsgs.push({role:'assistant', content:'…'});
  setInner();
  scrollChat();
  const reply = await aiChat(chatMsgs.slice(0,-1).map(m=>({role:m.role, content:m.content})));
  chatMsgs[chatMsgs.length-1] = {
    role:'assistant',
    content: reply || 'Assistant unavailable. Try again later.',
  };
  setInner();
  scrollChat();
}

function scrollChat(){
  const s = document.getElementById('chatScreen');
  if(s) s.scrollTop = s.scrollHeight;
}

function chatMic(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    toast(t('mic_unavailable')); return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'en-US';
  rec.onresult = (e)=>{
    const inp = document.getElementById('chatInput');
    if(inp) inp.value = e.results[0][0].transcript;
  };
  rec.start();
}

/* ═══════════════ CHAT WITH SELLER (mock) ═══════════════ */
let sellerChats = {};
function viewChatSeller(params){
  const key = params.sellerId;
  const msgs = sellerChats[key] || [];
  return `
  <div class="appbar">
    <button class="icon-btn" onclick="pop()">←</button>
    <div class="title">${esc(params.sellerName.split(',')[0])}</div>

      <div class="empty" style="flex:1">
        <div class="empty-circle">💬</div>
        <p>Say namaste to the artisan 🙏</p>
      </div>
    `:msgs.map(m=>`
      <div class="chat-bubble ${m.mine?'me':'them'}">${esc(m.text)}</div>
    `).join('')}
  </div>
  <div style="padding:10px;background:#FFF9EC;border-top:1px solid rgba(217,164,65,.4);display:flex;gap:8px;align-items:center">
    <input id="sellerChatInput" placeholder="Message…"
      style="flex:1;padding:12px 14px;border-radius:24px;border:1px solid rgba(217,164,65,.5);background:#fff;font-size:14px"
      onkeydown="if(event.key==='Enter')sendSellerChat('${key}')">
    <button class="btn" style="padding:10px 14px;border-radius:50%" onclick="sendSellerChat('${key}')">➤</button>
  </div>`;
}
function sendSellerChat(key){
  const inp = document.getElementById('sellerChatInput');
  const text = (inp?.value||'').trim();
  if(!text) return;
  if(!sellerChats[key]) sellerChats[key] = [];
  sellerChats[key].push({mine:true, text});
  if(inp) inp.value = '';
  setInner();
  const s = document.getElementById('sellerChatScreen');
  if(s) s.scrollTop = s.scrollHeight;
  // auto-reply after delay
  setTimeout(()=>{
    sellerChats[key].push({mine:false, text:'Namaste! Thank you for reaching out. 🙏 How can I help you?'});
    setInner();
    const s2 = document.getElementById('sellerChatScreen');
    if(s2) s2.scrollTop = s2.scrollHeight;
  }, 800);
}

/* ═══════════════ OVERLAY DISPATCHER ═══════════════ */
function viewOverlay(item){
  const {screen, params} = item;
  let inner = '';
  switch(screen){
    case 'product':
      const p = getProduct(params.id);
      if(!p) return '';
      inner = viewProductDetail(p);
      break;
    case 'writeReview': inner = viewWriteReview(params); break;
    case 'seller': inner = viewSeller(params); break;
    case 'checkout': inner = viewCheckout(); break;
    case 'orderSuccess': inner = viewOrderSuccess(params); break;
    case 'tracking': inner = viewTracking(params); break;
    case 'myShop': inner = viewMyShop(); break;
    case 'wishlist': inner = viewWishlist(); break;
    case 'orders': inner = viewOrders(); break;
    case 'notifications': inner = viewNotifications(); break;
    case 'addressBook': inner = viewAddressBook(); break;
    case 'editAddress': inner = viewEditAddress(params); break;
    case 'setLocation': inner = viewSetLocation(); break;
    case 'help': inner = viewHelp(); break;
    case 'about': inner = viewAbout(); break;
    case 'coupons': inner = viewCoupons(); break;
    case 'settings': inner = viewSettings(); break;
    case 'referral': inner = viewReferral(); break;
    case 'privacy': inner = viewPrivacy(); break;
    case 'feedback': inner = viewFeedback(); break;
    case 'notifPrefs': inner = viewNotifPrefs(); break;
    case 'chat': inner = viewChat(); break;
    case 'chatSeller': inner = viewChatSeller(params); break;
    default: inner = `<div class="appbar"><button class="icon-btn" onclick="pop()">←</button>
      <div class="title">${screen}</div></div><div class="screen doodle"></div>`;
  }
  return `<div class="overlay">${inner}</div>`;
}
